# SpectraFrame — self-hosted Docker Compose
#
# Two ways to configure (pick one):
#   A. Environment (recommended for Portainer): in the Portainer UI add an
#      environment variable SPECTRA_CONFIG_JSON with your full config JSON
#      (same keys as server/config.json.example). No files needed.
#   B. Shell (SSH): SPECTRA_CONFIG_JSON="$(cat server/config.json)" \
#         docker compose up -d --build
#
# The container needs no config file mounted: on first boot the server
# writes a default config, then SPECTRA_CONFIG_JSON overrides it.
# Data (device registry, photo blobs, Photos cache) lives in the
# spectra-data volume and survives rebuilds. Back it up with:
#   docker run --rm -v spectraframe_spectra-data:/data \
#     -v "$PWD":/backup alpine tar czf /backup/spectra-data.tgz /data

services:
  spectraframe:
    # Image is built by GitHub Actions and published to Docker Hub.
    # Portainer pulls it — no local build needed.
    image: erchiragjain92/folioframe:latest
    container_name: spectraframe
    ports:
      - "8765:8765"
    environment:
      PORT: "8765"
      # Config comes from the SPECTRA_CONFIG_JSON env var (set in Portainer's
      # stack environment variables). ${...} substitution is how Portainer
      # passes UI env vars into containers for git-based stacks.
      SPECTRA_CONFIG_JSON: ${SPECTRA_CONFIG_JSON}
      # Example for local `docker compose up` with a config file instead:
      # SPECTRA_CONFIG_JSON: '{"public_url":"https://frame.example.com","auth":{"allowlist":["you@example.com"]},"google":{"client_id":"...","client_secret":"..."},"source":"picsum"}'
      # The service's own Google OAuth client (admin-configured once under
      # "google" in the JSON). Users just click Sign in with Google.
      # auth.allowlist is just an email list
      # (empty = anyone may sign in; accounts are isolated per user).
    volumes:
      - spectra-data:/app/server/data
      # Firmware binaries live here so new releases can be published
      # without rebuilding the container: copy the packaged files
      # (tools/package_firmware.sh output) into the volume and they
      # go live immediately (no restart needed). On first deploy Docker
      # copies the image's baked-in firmware into the fresh volume.
      - firmware:/app/server/firmware
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/config', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  spectra-data:
  firmware:
