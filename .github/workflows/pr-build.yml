name: PR Build Check

# Compile-checks firmware on pull requests. No releases, no deploys —
# just proves the code builds before merge.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'lib/**'
      - 'tools/package_firmware.sh'

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-6.2.0-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-6.2.0-

      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Build firmware
        run: pio run -e ee02
