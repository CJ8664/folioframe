name: PR Build Check

# Compile-check firmware changes on pull requests; never release or deploy.
on:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "tools/package_firmware.sh"
      - ".github/workflows/firmware.yml"
      - ".github/workflows/pr-build.yml"

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-6.2.0-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-6.2.0-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build firmware
        run: pio run -e ee02
