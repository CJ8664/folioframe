name: Deploy

# Builds the server Docker image and deploys to production on merge to main.
# Triggered only by server/container changes — firmware-only changes skip this.
# Firmware is delivered via GitHub Releases + the server's runtime refresh,
# not baked into the image.

on:
  push:
    branches: [main]
    paths:
      - 'server/**/*.py'
      - 'server/static/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
      - '!server/firmware/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/folioframe
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          CF_BYPASS_HEADER: ${{ secrets.CF_BYPASS_HEADER }}
        run: |
          # Git-managed stack: use the git redeploy endpoint (pulls compose
          # from the repo, then pullImage pulls the fresh Docker Hub image).
          # x-ci-bypass header lets this through Cloudflare Bot Fight Mode
          # via a WAF custom rule (re-enable Bot Fight Mode safely).
          # Capture HTTP status so failures show Portainer's actual message.
          HTTP_STATUS=$(curl -s -o /tmp/portainer-redeploy.json -w "%{http_code}" -X PUT \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$PORTAINER_ENDPOINT_ID" \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "x-ci-bypass: $CF_BYPASS_HEADER" \
            -H "Content-Type: application/json" \
            -d '{"pullImage": true, "repositoryReferenceName": "refs/heads/main"}')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Portainer redeploy failed (HTTP $HTTP_STATUS)"
            cat /tmp/portainer-redeploy.json
            exit 1
          fi
          echo "Portainer redeploy triggered"

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://frame.chiragjain.info/api/config >/dev/null 2>&1; then
              echo "Server healthy"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 10
          done
          echo "Server did not become healthy in time" >&2
          exit 1
