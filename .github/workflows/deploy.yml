name: Deploy

# Firmware is delivered through GitHub Releases; only server/container changes
# publish and deploy a new server image.
on:
  push:
    branches: [main]
    paths:
      - "server/**/*.py"
      - "server/static/**"
      - "server/requirements.txt"
      - "server/requirements-firebase.txt"
      - "server/tests/run.sh"
      - "server/config.json.example"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
      - "!server/firmware/**"
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements-firebase.txt

      - name: Run server tests
        run: bash server/tests/run.sh

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/folioframe
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PORTAINER_URL"
          test -n "$PORTAINER_API_KEY"
          [[ "$PORTAINER_ENDPOINT_ID" =~ ^[0-9]+$ ]]
          [[ "$PORTAINER_STACK_ID" =~ ^[0-9]+$ ]]
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --request PUT \
            --header "X-API-Key: $PORTAINER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"pullImage":true,"repositoryReferenceName":"refs/heads/main"}' \
            "${PORTAINER_URL%/}/api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$PORTAINER_ENDPOINT_ID")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Portainer redeploy failed (HTTP $status)"
            exit 1
          fi
          echo "Portainer redeploy triggered"

      - name: Verify deployed service health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://frame.chiragjain.info/healthz"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "$health_url"; then
              echo "Server health check passed."
              exit 0
            fi
            echo "Health check $attempt/30 failed; retrying in 5 seconds."
            sleep 5
          done
          echo "Server did not become healthy within five minutes." >&2
          exit 1
