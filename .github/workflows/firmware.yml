name: Firmware build and release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "tools/package_firmware.sh"
      - ".github/workflows/firmware.yml"

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build firmware
        run: pio run -e ee02

      - name: Package firmware
        run: tools/package_firmware.sh ee02

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < server/firmware/VERSION)"
          build="$(tr -d '\r\n' < server/firmware/BUILD)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build" =~ ^[1-9][0-9]{0,9}$ ]]
          (( build <= 4294967295 ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=folioframe-v$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: FolioFrame firmware v${{ steps.release.outputs.version }}
          body: |
            FolioFrame firmware v${{ steps.release.outputs.version }}

            Monotonic firmware build: ${{ steps.release.outputs.build }}
          files: |
            server/firmware/firmware.bin
            server/firmware/firmware-${{ steps.release.outputs.version }}.bin
            server/firmware/VERSION
            server/firmware/BUILD
          overwrite_files: true
          make_latest: true
