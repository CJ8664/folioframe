name: Firmware

# Build EE02 firmware and publish stable releases independently of server
# image builds and deployments.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "tools/package_firmware.sh"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-6.2.0-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-6.2.0-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build firmware
        run: pio run -e ee02

      - name: Package firmware
        run: tools/package_firmware.sh ee02

      - name: Read release metadata
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < server/firmware/VERSION)"
          build="$(tr -d '\r\n' < server/firmware/BUILD)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build" =~ ^[1-9][0-9]{0,9}$ ]]
          (( build <= 4294967295 ))
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
          printf 'tag=folioframe-v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FolioFrame Firmware ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})
          body: |
            Firmware ${{ steps.version.outputs.version }} — build ${{ steps.version.outputs.build }}.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          files: |
            server/firmware/firmware.bin
            server/firmware/firmware-${{ steps.version.outputs.version }}.bin
            server/firmware/VERSION
            server/firmware/BUILD
