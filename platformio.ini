; SpectraFrame — PlatformIO project
; Board: Seeed XIAO ESP32S3 Plus on the EE02 driver board.
; IMPORTANT: enable PSRAM (Tools → PSRAM in Arduino IDE, or the
; equivalent board option here) — the 960 KB frame buffer requires it.

[env:ee02]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/patch_seeed_gfx.py
lib_deps =
  https://github.com/seeed-studio/seeed_gfx2.git
  tzapu/WiFiManager@^2.0.17
; Large app partition: OTA needs 2 app slots + room for the sketch.
board_build.partitions = default_8MB.csv
