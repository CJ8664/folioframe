; SpectraFrame — PlatformIO project
; Board: Seeed XIAO ESP32S3 Plus on the EE02 driver board.
; IMPORTANT: enable PSRAM (Tools → PSRAM in Arduino IDE, or the
; equivalent board option here) — the 960 KB frame buffer requires it.

[env:ee02]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX.git
  tzapu/WiFiManager@^2.0.17
; Large app partition: OTA needs 2 app slots + room for the sketch.
board_build.partitions = default_8MB.csv


; Seeed_GFX old library setup for 7.09" GDEB0709E01 (setup 518)
build_flags =
  -D USER_SETUP_LOADED
  -D GDEB0709E01_DRIVER
  -D EPAPER_ENABLE
  -D TFT_WIDTH=1200
  -D TFT_HEIGHT=1600
  -D EPD_WIDTH=1200
  -D EPD_HEIGHT=1600
  -D TFT_SCLK=D8
  -D TFT_MISO=D9
  -D TFT_MOSI=D10
  -D TFT_CS=D7
  -D TFT_CS1=41
  -D TFT_DC=10
  -D TFT_BUSY=D3
  -D TFT_RST=38
  -D TFT_ENABLE=D6
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT

[env:ee02_gfx2_test]

platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager@^2.0.17
board_build.partitions = default_8MB.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

